name: Clever Caravan
version: "0.4.3"
slug: clever_caravan
description: Installs and keeps Clever Caravan integrations up to date on this rig.
url: https://github.com/sambarlick/clever_caravan_app
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: homeassistant
map:
  - type: homeassistant_config
    read_only: false
options:
  tpms: false
  location: false
  waymote: false
  power: false
  dashboard: false
  weather: false
  check_interval_minutes: 5
  update_window_start: "02:00"
  update_window_hours: 2
schema:
  tpms: bool
  location: bool
  waymote: bool
  power: bool
  dashboard: bool
  weather: bool
  check_interval_minutes: int(1,1440)
  update_window_start: str
  update_window_hours: int(1,24)
