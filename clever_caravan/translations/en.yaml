configuration:
  tpms:
    name: "Clever Caravan: TPMS"
    description: Tyre pressure monitoring. Supported hardware - Safety Sam sensors.
  location:
    name: "Clever Caravan: Location"
    description: GPS tracking with parked snapshots and Australia-aware geocoding.
  waymote:
    name: "Clever Caravan: Waymote"
    description: Control and monitoring for the Waymote CAN-bus bridge.
  power:
    name: "Clever Caravan: Power"
    description: Battery, solar, inverter and tank monitoring for Victron systems.
  dashboard:
    name: "Clever Caravan: Dashboard"
    description: The Clever Caravan dashboard and its cards.
  weather:
    name: "Clever Caravan: Weather"
    description: Bureau of Meteorology forecasts that follow the van as it moves.
  core:
    name: "Clever Caravan: Core"
    description: Rig-wide modes such as Hibernation (caravan stowed long-term).
  check_interval_minutes:
    name: Check interval (minutes)
    description: How often the App checks for integration changes.
  update_window_start:
    name: Update window start
    description: Time of day (HH:MM) when updates and restarts may happen.
  update_window_hours:
    name: Update window length (hours)
    description: How long the update window stays open.
  fleet_enrolment:
    name: Fleet enrolment code
    description: One-line code from cc-pki.sh. Turns on fleet telemetry for this rig. Leave empty to keep telemetry off.
  restart_now:
    name: Restart immediately
    description: Restart Home Assistant as soon as changes are made, ignoring the update window.
